services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    ports:
      - '1521:1521'
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: ${ORACLE_USER}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD}
    healthcheck:
      test: ['CMD', 'healthcheck.sh']
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - oracle-data:/opt/oracle/oradata

volumes:
  oracle-data:
